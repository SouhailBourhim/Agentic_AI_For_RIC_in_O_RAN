# Runs the test suite on every push and pull request.
# No trained models and no MLflow store are needed: the tests train tiny models and use
# temporary MLflow databases, and the notebook test stops cleanly when no model exists.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Pinned to the same Ubuntu as the development machine (WSL 24.04), so a runner image
    # change (ubuntu-latest moves to 26) cannot break the tests without a commit here.
    runs-on: ubuntu-24.04
    steps:
      # Both actions run on Node.js 24 (Node 20 actions are deprecated on GitHub runners).
      - uses: actions/checkout@v7
      # setup-uv publishes no major tag since v8, so the exact version is pinned.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Lint (bugs, not style; rules in pyproject.toml)
        run: uv run ruff check
      - name: Run tests
        run: uv run pytest -q
