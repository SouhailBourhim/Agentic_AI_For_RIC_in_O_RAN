# Runs the test suite on every push and pull request.
# No trained models and no MLflow store are needed: the tests train tiny models and use
# temporary MLflow databases, and the notebook test stops cleanly when no model exists.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
