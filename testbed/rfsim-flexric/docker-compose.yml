# SPDX-License-Identifier: MIT
# gNB (rfsim, E2 agent) + FlexRIC nearRT-RIC + KPM xApps + 3 nrUE, attached to the CN5G network.
# Source: https://github.com/duranta-project/openairinterface5g (tag v3.0.0), ci-scripts/yaml_files/5g_rfsimulator_flexric/docker-compose.yml
# Changes: local config paths; images pinned to v3.0.0; kept only the KPM and
# MAC/RLC/PDCP/GTP monitor xApps; 3 UEs (IMSI ...02, ...03, ...04).
# M06: one UE per slice (eMBB, URLLC, best effort), each with its own conf (IMSI + PDU session slice).
# M07a: our KPM xApp (xapp-kpm-slices, one subscription per slice) and our gNB image (OAI v3.0.0 +
# testbed/gnb/kpm-per-ue.patch and slice-control.patch); GNB_IMAGE=oaisoftwarealliance/oai-gnb:v3.0.0 gives the stock gNB.

services:
    nearRT-RIC:
        image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-v3.0.0}
        container_name: nearRT-RIC
        networks:
            public_net:
                ipv4_address: 192.168.70.150
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s

    xapp-kpm-moni:
        image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-v3.0.0}
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_kpm_moni"
        container_name: xapp-kpm-moni
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.155
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep xapp_kpm_moni"
            interval: 10s
            timeout: 5s

    xapp-kpm-slices:
        image: agentic-ric/xapp-kpm-slices:${FLEXRIC_TAG:-v3.0.0}   # built from xapps/kpm/Dockerfile
        container_name: xapp-kpm-slices
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.156
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep xapp_kpm_slices"
            interval: 10s
            timeout: 5s

    rl-xapp:   # M07b: RL runner + champion policy + slice-control xApp; not started by up.sh
        profiles: [control]
        image: ${RL_XAPP_IMAGE:-agentic-ric/rl-xapp:latest}   # xapps/rl/build.sh tags :v<version> and :latest
        container_name: rl-xapp
        depends_on:
            - nearRT-RIC
            - oai-gnb
        user: "${RL_XAPP_USER:-1000:1000}"   # the files it writes in var/ stay yours
        networks:
            public_net:
                ipv4_address: 192.168.70.159
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - ../../var:/app/var   # var/ric-testbed.db, var/events.jsonl, shared with WSL

    xapp-gtp-mac-rlc-pdcp-moni:
        image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-v3.0.0}
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_gtp_mac_rlc_pdcp_moni"
        container_name: xapp-gtp-mac-rlc-pdcp-moni
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.157
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep -f xapp_gtp_mac_rlc_pdcp_moni"
            interval: 10s
            timeout: 5s

    oai-gnb:
        image: ${GNB_IMAGE:-agentic-ric/oai-gnb:v3.0.0-slice}   # built by testbed/gnb/build.sh
        privileged: true
        container_name: rfsim5g-oai-gnb
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - nearRT-RIC
        networks:
            public_net:
                ipv4_address: 192.168.70.151
        volumes:
            - ./conf/gnb.conf:/opt/oai-gnb/etc/gnb.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    oai-nr-ue-embb:
        image: ${REGISTRY-oaisoftwarealliance/}${NRUE_IMG:-oai-nr-ue}:${TAG:-v3.0.0}
        privileged: true
        container_name: rfsim5g-oai-nr-ue-embb
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3619200000 --rfsimulator.[0].serveraddr 192.168.70.151 --log_config.global_log_options level,nocolor,time
        depends_on:
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.152
        volumes:
            - ./conf/nrue-embb.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    oai-nr-ue-urllc:
        image: ${REGISTRY-oaisoftwarealliance/}${NRUE_IMG:-oai-nr-ue}:${TAG:-v3.0.0}
        privileged: true
        container_name: rfsim5g-oai-nr-ue-urllc
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3619200000 --rfsimulator.[0].serveraddr 192.168.70.151 --log_config.global_log_options level,nocolor,time
        depends_on:
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.153
        volumes:
            - ./conf/nrue-urllc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    oai-nr-ue-be:
        image: ${REGISTRY-oaisoftwarealliance/}${NRUE_IMG:-oai-nr-ue}:${TAG:-v3.0.0}
        privileged: true
        container_name: rfsim5g-oai-nr-ue-be
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3619200000 --rfsimulator.[0].serveraddr 192.168.70.151 --log_config.global_log_options level,nocolor,time
        depends_on:
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.158
        volumes:
            - ./conf/nrue-be.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    public_net:
        name: oai-cn5g-public-net
        external: true
