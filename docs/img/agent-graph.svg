<text x="688" y="204" text-anchor="middle" class="sub">console (demo)</text>
<rect x="778.0" y="158.0" width="124" height="64" rx="8" class="box" stroke="#3a3a38"/>
<text x="840" y="186" text-anchor="middle" class="name">observe</text>
