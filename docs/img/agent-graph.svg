<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/></marker>
<style>.box{fill:#fff;stroke-width:1.6}.name{font-size:14px;font-weight:700;fill:#0b0b0b}.sub{font-size:11.5px;fill:#52514e}
.edge{stroke:#3a3a38;stroke-width:1.5;fill:none}.back{stroke:#3a3a38;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
.label{font-size:12px;fill:#0b0b0b;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.legend{font-size:12px;fill:#52514e}</style></defs>
<rect width="1200" height="380" rx="14" fill="#fff"/>
<rect x="18.0" y="158.0" width="124" height="64" rx="8" class="box" stroke="#2a78d6"/>
