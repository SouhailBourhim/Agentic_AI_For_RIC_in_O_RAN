<rect x="170.0" y="158.0" width="124" height="64" rx="8" class="box" stroke="#2a78d6"/>
<text x="232" y="186" text-anchor="middle" class="name">plan</text>
<text x="232" y="204" text-anchor="middle" class="sub">LLM, one tool call</text>
