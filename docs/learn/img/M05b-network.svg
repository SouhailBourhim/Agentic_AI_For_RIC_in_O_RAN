<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 560" width="1250" height="560" font-family="Helvetica, Arial, sans-serif">
<!-- M05b: where the Hermes container sits and the only two ways out. Source of M05b-network.png.
     Files: gateway/hermes/docker-compose.yml, gateway/hermes/config.yaml. -->
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/></marker>
<marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<style>.zone{fill:#f6f6f3;stroke:#e2e1dc;stroke-width:1.2}.zname{font-size:13.5px;font-weight:700;fill:#0b0b0b}.zsub{font-size:12px;fill:#52514e}
.box{fill:#fff;stroke:#3a3a38;stroke-width:1.6}.name{font-size:14px;font-weight:700;fill:#0b0b0b}.sub{font-size:12px;fill:#52514e}
.ln{stroke:#3a3a38;stroke-width:1.8;fill:none}.no{stroke:#c0392b;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
.label{font-size:12px;fill:#0b0b0b;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.lno{font-size:12px;fill:#c0392b;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}</style></defs>
<rect width="1250" height="560" rx="14" fill="#fff"/>

<rect x="14" y="60" width="520" height="340" rx="12" class="zone"/>
<text x="30" y="84" class="zname">hermes-only: Docker network with internal: true</text>
<text x="30" y="104" class="zsub">no default route, no DNS for outside names, no published ports</text>
<rect x="36" y="140" width="210" height="170" rx="8" class="box"/>
<text x="141" y="168" text-anchor="middle" class="name">Hermes v0.22.7</text>
<text x="141" y="190" text-anchor="middle" class="sub">user hermes, no capabilities</text>
<text x="141" y="210" text-anchor="middle" class="sub">no Docker socket, no host files</text>
<text x="141" y="230" text-anchor="middle" class="sub">toolsets: only mcp-ric</text>
<text x="141" y="250" text-anchor="middle" class="sub">3 tools reach the model</text>
<text x="141" y="270" text-anchor="middle" class="sub">(checked on the wire)</text>
<rect x="340" y="126" width="172" height="80" rx="8" class="box"/>
<text x="426" y="156" text-anchor="middle" class="name">gateway-relay</text>
<text x="426" y="178" text-anchor="middle" class="sub">socat: port 8100 only</text>
<rect x="340" y="256" width="172" height="80" rx="8" class="box"/>
<text x="426" y="286" text-anchor="middle" class="name">ollama-relay</text>
<text x="426" y="308" text-anchor="middle" class="sub">socat: port 11434 only</text>
<line x1="246" y1="190" x2="338" y2="168" class="ln" marker-end="url(#a)"/>
<text x="292" y="168" text-anchor="middle" class="label">MCP</text>
<line x1="246" y1="260" x2="338" y2="294" class="ln" marker-end="url(#a)"/>
<text x="292" y="296" text-anchor="middle" class="label">LLM</text>

<rect x="600" y="60" width="636" height="340" rx="12" class="zone"/>
<text x="616" y="84" class="zname">The host (WSL2 and Windows)</text>
<rect x="640" y="118" width="190" height="96" rx="8" class="box"/>
<text x="735" y="146" text-anchor="middle" class="name">MCP gateway</text>
<text x="735" y="168" text-anchor="middle" class="sub">127.0.0.1:8100/mcp</text>
<text x="735" y="188" text-anchor="middle" class="sub">exactly 3 tools; Host checked</text>
<rect x="1000" y="118" width="210" height="96" rx="8" class="box"/>
<text x="1105" y="146" text-anchor="middle" class="name">Agent service</text>
<text x="1105" y="168" text-anchor="middle" class="sub">127.0.0.1:8000</text>
<text x="1105" y="188" text-anchor="middle" class="sub">no confirm or apply endpoint</text>
<rect x="640" y="268" width="190" height="96" rx="8" class="box"/>
<text x="735" y="298" text-anchor="middle" class="name">Ollama (Windows)</text>
<text x="735" y="320" text-anchor="middle" class="sub">qwen3:8b, window 4096</text>
<text x="735" y="340" text-anchor="middle" class="sub">shared with the agent worker</text>
<line x1="512" y1="166" x2="638" y2="166" class="ln" marker-end="url(#a)"/>
<line x1="512" y1="296" x2="638" y2="316" class="ln" marker-end="url(#a)"/>
<text x="572" y="150" text-anchor="middle" class="label">:8100</text>
<text x="572" y="290" text-anchor="middle" class="label">:11434</text>
<line x1="830" y1="166" x2="998" y2="166" class="ln" marker-end="url(#a)"/>
<text x="914" y="156" text-anchor="middle" class="label">HTTP</text>
<rect x="940" y="268" width="270" height="96" rx="8" class="box"/>
<text x="1075" y="298" text-anchor="middle" class="name">Worker, verifier, console</text>
<text x="1075" y="320" text-anchor="middle" class="sub">the operator confirms here,</text>
<text x="1075" y="340" text-anchor="middle" class="sub">in a separate terminal</text>
<line x1="1105" y1="214" x2="1105" y2="266" class="ln" marker-end="url(#a)"/>

<rect x="14" y="440" width="520" height="104" rx="12" class="zone"/>
<text x="30" y="466" class="zname">Testbed network 192.168.70.128/26</text>
<text x="30" y="488" class="zsub">gNB, near-RT RIC, AMF, SMF, UPF</text>
<rect x="600" y="440" width="300" height="104" rx="12" class="zone"/>
<text x="616" y="466" class="zname">Internet</text>
<text x="616" y="488" class="zsub">update check, web, anything else</text>
<path d="M141,310 V430" class="no" marker-end="url(#x)"/>
<text x="150" y="392" class="lno">no route</text>
<path d="M200,310 C240,400 600,380 680,432" class="no" marker-end="url(#x)"/>
<text x="420" y="412" class="lno">no route, no DNS</text>
<text x="30" y="36" font-size="16" font-weight="700" fill="#0b0b0b">Hermes's only two exits: each relay forwards one port to one address</text>
</svg>
