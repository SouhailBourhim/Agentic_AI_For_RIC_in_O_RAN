# Live monitoring of a wall-clock run: Prometheus scrapes the exporter, Grafana shows it.
#   uv run python -m monitoring.exporter          (in WSL, port 9108)
#   docker compose -f monitoring/compose.yml up -d
#   Grafana: http://localhost:3000 (anonymous viewer; admin/admin to edit), Prometheus: http://localhost:9090
# The exporter runs in WSL, not in a container: it reads var/ric.db directly, and Docker Desktop
# containers reach it through host.docker.internal (checked on this machine in M04a).
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]  # also works on a plain Linux Docker engine
  grafana:
    image: grafana/grafana:13.2.5
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ric.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
