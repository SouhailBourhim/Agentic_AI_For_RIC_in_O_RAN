[project]
name = "agentic-ric-oran"
version = "0.1.0"
description = "LLM agent (LangGraph) steering a goal-conditioned RL xApp (DDPG) for RAN slicing, behind a deterministic verifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "stable-baselines3>=2.9.2",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "marimo>=0.25.2",
    "pytest>=8",
    "tensorboard>=2.21.0",
]

[tool.uv]
# This repo is an application, not a library we publish: uv manages the
# virtual environment and dependencies but does not build/install our code.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Flat layout: our packages (sim/, rl/, ...) live at the repo root, so we put
# the root on sys.path for the tests instead of installing the project.
pythonpath = ["."]

# torch from the CPU-only index: ~200 MB instead of a multi-GB CUDA build. DDPG's small
# networks train fast on 32 CPU threads, and the GPU stays free for Ollama (DECISIONS.md).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
