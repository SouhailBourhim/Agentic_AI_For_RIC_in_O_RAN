[project]
name = "agentic-ric-oran"
version = "0.1.0"
description = "LLM agent (LangGraph) steering a goal-conditioned RL xApp (DDPG) for RAN slicing, behind a deterministic verifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "gymnasium>=1.4.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "stable-baselines3>=2.9.2",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "marimo>=0.25.2",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "tensorboard>=2.21.0",
]

[tool.uv]
# This repo is an application, not a library we publish: uv manages the
# virtual environment and dependencies but does not build/install our code.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Flat layout: our packages (sim/, rl/, ...) live at the repo root, so we put
# the root on sys.path for the tests instead of installing the project.
pythonpath = ["."]

# torch from the CPU-only index: ~200 MB instead of a multi-GB CUDA build. DDPG's small
# networks train fast on 32 CPU threads, and the GPU stays free for Ollama (DECISIONS.md).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# Lint for bugs, not style (DECISIONS 2026-11-09): pyflakes (F), pycodestyle's error classes (E4, E7, E9)
# and bugbear (B). Ruff's wider default set is mostly import order and formatting, which we don't enforce.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# B905 zip(strict=): 66 existing calls, some rely on truncation; E731: one-line lambdas are used on purpose;
# B008: FastAPI's Depends(...) in argument defaults is that framework's idiom.
ignore = ["B905", "E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]  # marimo displays a cell's last expression on purpose
